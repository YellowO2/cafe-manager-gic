
services:
  # PostgreSQL Database
  postgres:
    image: postgres:13
    container_name: cafe-db
    restart: always
    environment:
    # For local demo and not secrets
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cafe_db
    # Commented out for deployment, enable if local access is needed
    # ports: 
    #   - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cafe_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafe-backend
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/cafe_db
      NODE_ENV: production
      PORT: 3000
      # Will be overridden in production deployment
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate reset --force --skip-seed &&
             node dist/prisma/seed.js &&
             node dist/main"

  # React Frontend (Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Will be overridden in production deployment
        VITE_API_BASE_URL: http://localhost:3000
    container_name: cafe-frontend
    restart: always
    ports:
      - '5173:8080'
    depends_on:
      - backend

volumes:
  postgres_data:
